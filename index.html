<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subs-Pixel con Avatar</title>
<style>
body {
    background-color: rgb(0,0,0);
    color: #00ff00;
    font-family: 'Courier New', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 0;
    padding: 50px 0;
}

h1 {
    font-size: 3em;
    text-shadow: 2px 2px #00ff00;
    margin-bottom: 50px;
}

/* El panel permite que los elementos se adapten si falta espacio en pantalla */
.panel {
    display: flex;
    flex-wrap: wrap; 
    justify-content: center;
    align-items: center;
    gap: 40px;
    max-width: 95vw; 
    margin: 0 auto;
}

/* Caja del avatar / logo */
.avatar-box {
    width: 200px;
    height: 270px;
    border: 6px solid #02791c;
    border-radius: 8px;
    background-color: #00ff00;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-shrink: 0;
}

.avatar-box img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    image-rendering: pixelated;
}

/* Contadores */
.contador {
    display: flex;
    flex-direction: column;
    gap: 40px;
    max-width: 100%;
}

/* Cada fila se adapta de forma fluida para no recortar texto */
.item {
    display: flex;
    flex-wrap: wrap; 
    align-items: center;
    gap: 20px;
}

.item img {
    image-rendering: pixelated;
    flex-shrink: 0;
}

/* El número del contador */
.item .sub-count {
    font-size: 6em;
    font-weight: bold;
    color: #02791c;
    text-shadow: 1px 1px #00ff00;
    line-height: 1;
}

/* El nombre de usuario con el mismo tamaño y estilo gigante */
.item .user-handle {
    font-size: 6em; 
    font-weight: bold;
    color: #02791c; 
    text-shadow: 1px 1px #00ff00; 
    line-height: 1;
}

/* Logos de YouTube / Instagram */
.youtube-logo {
    width: 130px;
    height: 100px;
}

.instagram-logo {
    width: 100px;
    height: 100px;
    margin-left: 15px; 
}
</style>
</head>
<body>

<div class="panel">
    <div class="avatar-box" id="avatar-box">
        <img id="logo-dinamico" src="descarga.png" alt="Mi Avatar">
    </div>

    <div class="contador">
        <div class="item">
            <img src="youtube2.png" alt="YouTube Logo" class="youtube-logo">
            <span id="youtube-subs" class="sub-count">0</span>
            <span class="user-handle">@vaperacho</span>
        </div>
        <div class="item">
            <img src="insta.png" alt="Instagram Logo"
